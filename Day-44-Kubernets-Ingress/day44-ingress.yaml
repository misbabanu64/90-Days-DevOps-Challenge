# DESIGN ONLY - not applied to cluster (no controller, no frontend/backend Services)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: day44-shop
spec:
  ingressClassName: nginx
  rules:
  - host: shop.example.test
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: backend
            port:
              number: 8080
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 80
