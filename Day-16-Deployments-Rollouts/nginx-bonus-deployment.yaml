apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-bonus
  annotations:
    kubernetes.io/change-cause: "Bonus: initial deployment nginx 1.27 with maxSurge 1, maxUnavailable 0"
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: nginx-bonus
  template:
    metadata:
      labels:
        app: nginx-bonus
    spec:
      containers:
      - name: nginx
        image: nginx:1.27
        ports:
        - containerPort: 80
