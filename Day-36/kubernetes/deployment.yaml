apiVersion: apps/v1
kind: Deployment
metadata:
  name: winter-arc-app
  namespace: day36
spec:
  replicas: 2
  selector:
    matchLabels:
      app: winter-arc-app
  template:
    metadata:
      labels:
        app: winter-arc-app
    spec:
      containers:
      - name: app
        image: winter-arc-app:v1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
        env:
        - name: PORT
          value: "3000"
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 3
          periodSeconds: 5
